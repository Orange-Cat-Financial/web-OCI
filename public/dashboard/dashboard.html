<script>
  const labelsLinha = [
    "Janeiro",
    "fevereiro",
    "Março",
    "Abril",
    "Maio",
    "Junho",
  ];

  new Chart(document.getElementById("graficoLinha"), {
    type: "line",
    data: {
      labels: labelsLinha,
      datasets: [
        {
          label: "Dinheiro na conta",
          data: [1200, 1350, 1100, 980, 800, 1150, 1400],
          borderColor: "#e15806",
          backgroundColor: "#e15806",
          borderWidth: 4,
        },
      ],
    },
    options: {
      responsive: false,
      scales: {
        y: {
          grid: {
            color: "#737373",
          },
        },
      },
    },
  });
</script>
