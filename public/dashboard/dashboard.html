<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orange Cat</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      rel="icon"
      type="image/png"
      href="../assets/icones/log-sem-fundo.png"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/funci.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Krona+One&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body
    onload="
      obterDadosGrafico();
      obterDadosRosca();
      oValorTotal();
      retornar3Linhas();
      mostrarGastoCategoria();
      validarSessao();
    "
  >
    <header id="cabecalho">
      <div class="ft_e_nm">
        <a href="dashboard.html">
          <img
            src="../assets/icones/log-sem-fundo.png"
            style="height: 90px; width: 80px"
          />
        </a>
        <span> <span style="color: #f65d09">Orange</span> Cat</span>
      </div>

      <div class="criar_conta_he">
        <div class="usuarioHeader">
          <img
            id="img_usuario"
            src="../assets/imgUsuarioAdd/foto-perfil/sem_usuario.png"
            style="width: 38px; height: 38px"
          /><a class="hd_nm_usuario" href="usuario.html"
            ><span id="b_usuario">usuário</span></a
          >
        </div>
      </div>
    </header>
    <div id="pt_baixo_funci">
      <div class="pt_esquerda_menu">
        <div class="ls_esq">
          <a id="a_transacao" href="addTr.html">Transação</a>
          <a id="a_historico" href="historicoTr.html">Historico</a>
          <a id="a_escolhido" href="dashboard.html">Dashboard</a><br />
          <a id="a_n_aventura" href="addAventura.html">Nova aventura</a>
          <a id="a_s_aventura" href="aventuras.html">Suas aventuras</a><br />
          <a id="a_usuario" href="usuario.html">Perfil</a>
        </div>
      </div>
      <div class="pt_direita_conteudo">
        <div class="container">
          <div class="item">
            <span>Valor na conta:</span>
            <span class="valor_kpi_cima" id="saldoTotal">R$ 0,00</span>
          </div>
          <div class="item">
            <span>Ganhos:</span>
            <div class="seta_com_span">
              <img src="../assets/png/cima_branco.png" class="setas st_cm" />
              <span class="valor_kpi_cima" id="totalGanhos">R$ 0,00</span>
            </div>
          </div>
          <div class="item">
            <span>Despesas:</span>
            <div class="seta_com_span">
              <img src="../assets/png/baixo_branco.png" class="setas st_bx" />
              <span class="valor_kpi_cima" id="totalDespesas"> R$ 0,00</span>
            </div>
          </div>
        </div>
        <div class="graficos">
          <div class="graficoEsq" id="graficoEsq">
            <canvas id="graficoLinha"></canvas>
          </div>
          <div class="graficoDir">
            <canvas id="graficoRosca"></canvas>
            <div id="sp_g_rosca">
              <div id="pt_cima_btsl">
                <h4>Quanto gastou com?</h4>
                <div id="bt_sl">
                  <select id="sda" onchange="mostrarGastoCategoria()">
                    <option value="Comida">Comida</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Aluguel">Aluguel</option>
                    <option value="Roupa">Roupa</option>
                    <option value="Lazer">Lazer</option>
                    <option value="Outro">Outro</option>
                  </select>
                </div>
              </div>
              <div id="gastou_com">
                <span>Gastou:</span>
                <span id="valorCategoria">R$ 0,00</span>
                <span id="nomeCategoria">Com comida</span>
              </div>
            </div>
          </div>
        </div>
        <div class="kpi_pt_baixo">
          <div class="kpi_baixo_esquerda">
            <span class="tema_kpi_baixo">Ultimas 3 transações:</span>
            <div class="transacao_u5" id="ul1"></div>
            <div class="transacao_u5" id="ul2"></div>
            <div class="transacao_u5" id="ul3"></div>
          </div>
          <div class="kpi_baixo_direita">
            <div id="deixar_coluna">
              <span class="tema_kpi_baixo">Economizou:</span>
              <div class="pt_esquerda_meta">
                <span id="falta_bx_kpi">0%</span
                ><span id="da_receita">Da receita</span>
              </div>
            </div>
            <canvas id="graficoBarra"></canvas>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
  img_usuario.src = `../assets/imgUsuarioAdd/foto-perfil/${sessionStorage.FOTO_USUARIO}`;

  let proximaAtualizacao;

  function obterDadosGrafico() {
    if (proximaAtualizacao != undefined) {
      clearTimeout(proximaAtualizacao);
    }

    fetch(`/medidas/ultimas/${sessionStorage.ID_USUARIO}`, {
      cache: "no-store",
    })
      .then(function (response) {
        if (response.ok) {
          response.json().then(function (resposta) {
            console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
            resposta.reverse();

            plotarGrafico(resposta);
          });
        } else {
          console.error("Nenhum dado encontrado ou erro na API");
        }
      })
      .catch(function (error) {
        console.error(
          `Erro na obtenção dos dados p/ gráfico: ${error.message}`,
        );
      });
  }

  function obterDadosRosca() {
    if (proximaAtualizacao != undefined) {
      clearTimeout(proximaAtualizacao);
    }

    fetch(`/medidas/ultimasRosca/${sessionStorage.ID_USUARIO}`, {
      cache: "no-store",
    })
      .then(function (response) {
        if (response.ok) {
          response.json().then(function (resposta) {
            console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
            resposta.reverse();

            plotarGraficoRosca(resposta);
          });
        } else {
          console.error("Nenhum dado encontrado ou erro na API");
        }
      })
      .catch(function (error) {
        console.error(
          `Erro na obtenção dos dados p/ gráfico: ${error.message}`,
        );
      });
  }

  // mostrar função
  function plotarGrafico(resposta) {
    console.log("iniciando plotagem do gráfico...");

    let labels = [];
    let valores = [];

    console.log("----------------------------------------------");
    console.log(
      'Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":',
    );
    console.log(resposta);

    for (let i = 0; i < resposta.length; i++) {
      var registro = resposta[i];
      labels.push(registro.dataTransacao);
      valores.push(registro.SaldoTotal);
    }

    new Chart(document.getElementById("graficoLinha"), {
      type: "line",

      data: {
        labels: labels,

        datasets: [
          {
            label: "Dinheiro na conta",

            data: valores,

            borderColor: "#f65d09",
            backgroundColor: "#f65d09",

            borderWidth: 3,
            tension: 0.15,
          },
        ],
      },

      options: {
        responsive: true,
      },
    });
  }

  function plotarGraficoRosca(resposta) {
    console.log("iniciando plotagem do gráfico...");

    let labels = [];
    let valores = [];

    console.log("----------------------------------------------");
    console.log(
      'Estes dados foram recebidos pela funcao "plotarGraficoRosca" e passados para "plotarGraficoRosca":',
    );
    console.log(resposta);

    for (let i = 0; i < resposta.length; i++) {
      var registro = resposta[i];
      labels.push(registro.categoria);
      valores.push(registro.total);
    }

    const cores = [
      "#FF6B00",
      "#6C757D",
      "#7B2CBF",
      "#00B4D8",
      "#D7263D",
      "#FFB347",
      "#F5F5F5",
    ];

    console.log("----------------------------------------------");
    console.log("O gráfico será plotado com os respectivos valores:");
    console.log("Labels:");
    console.log(labels);
    console.log("Dados:");
    console.log("----------------------------------------------");

    new Chart(document.getElementById("graficoRosca"), {
      type: "doughnut",

      data: {
        labels: labels,

        datasets: [
          {
            label: "Gastou",

            data: valores,

            borderColor: cores,
            backgroundColor: cores,
          },
        ],
      },

      options: {
        responsive: true,
      },
    });
  }

  function oValorTotal() {
    let idUsuario = sessionStorage.ID_USUARIO;

    fetch(`/transacao/dinheiroTt/${idUsuario}`).then(function (resposta) {
      if (resposta.ok) {
        resposta.json().then(function (resposta) {
          console.log("Dados recebidos: ", JSON.stringify(resposta));
          let valorNC = Number(resposta[0].valorTotal);
          let receitaL = Number(resposta[0].receita);
          let despesaL = Number(resposta[0].despesa);
          //ARQCOMP
          let porcentagem = Number((valorNC / receitaL) * 100).toFixed(1);
          falta_bx_kpi.innerHTML = `${porcentagem}%`;
          plotarGraficoEconomizouBarra(porcentagem);

          saldoTotal.innerHTML = valorNC.toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL",
          });

          totalGanhos.innerHTML = receitaL.toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL",
          });
          totalDespesas.innerHTML = despesaL.toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL",
          });
        });
      }
    });
  }

  function mostrarGastoCategoria() {
    let categoria = sda.value;

    fetch(`/medidas/gastoCategoria/${sessionStorage.ID_USUARIO}/${categoria}`)
      .then(function (resposta) {
        if (resposta.ok) {
          resposta.json().then(function (dados) {
            let valor = 0;

            if (dados.length > 0) {
              valor = Number(dados[0].total);
            }

            valorCategoria.innerHTML = valor.toLocaleString("pt-BR", {
              style: "currency",
              currency: "BRL",
            });

            nomeCategoria.innerHTML = `Com ${categoria.toLowerCase()}`;
          });
        }
      })
      .catch(function (erro) {
        console.log(erro);
      });
  }

  function retornar3Linhas() {
    console.log("ID USUARIO FRONT:", sessionStorage.ID_USUARIO);
    let idUsuario = sessionStorage.ID_USUARIO;

    fetch(`/medidas/retornar3Linhas/${idUsuario}`)
      .then(function (resposta) {
        if (resposta.ok) {
          resposta.json().then(function (dados) {
            console.log(
              "Dados recebidos onde ESTA DANDO ERRO!!!: ",
              JSON.stringify(dados),
            );

            for (let i = 0; i < dados.length; i++) {
              let linhaAtual = dados[i];

              document.getElementById(`ul${i + 1}`).innerHTML = `
              <span>${linhaAtual.tipo}</span>
              <span>
                ${Number(linhaAtual.valor).toLocaleString("pt-BR", {
                  style: "currency",
                  currency: "BRL",
                })}
              </span>
              <span>${linhaAtual.categoria}</span>
              <span>${linhaAtual.dataTransacao}</span>
            `;
            }
          });
        }
      })
      .catch(function (erro) {
        console.error(erro);
      });
  }

  function plotarGraficoEconomizouBarra(porcentagem) {
    console.log("iniciando plotagem do gráfico...");

    console.log("----------------------------------------------");
    console.log(
      'Estes dados foram recebidos pela funcao "plotarGraficoEconomizouBarra" e passados para "plotarGrafico":',
    );

    const ctx = document.getElementById("graficoBarra");

    new Chart(ctx, {
      type: "bar",

      data: {
        labels: [""],

        datasets: [
          {
            label: "Economizou",
            data: [porcentagem],
            backgroundColor: "#f65d09",
          },
          {
            label: "Gastou",
            data: [100 - porcentagem],
            backgroundColor: "#6c6969",
          },
        ],
      },

      options: {
        indexAxis: "y",

        responsive: true,

        scales: {
          x: {
            stacked: true,
            max: 100,
            display: false,
          },

          y: {
            stacked: true,
            display: false,
          },
        },
      },
    });
  }

  function validarSessao() {
    let sessao = obterSessao();
    if (!sessao.id) {
      window.location = "login.html";
    }
    return sessao;
  }

  function obterSessao() {
    let id = sessionStorage.getItem("ID_USUARIO");
    let nome = sessionStorage.getItem("NOME_USUARIO");
    let email = sessionStorage.getItem("EMAIL_USUARIO");

    if (id && !sessionStorage.getItem("ID_USUARIO")) {
      sessionStorage.setItem("ID_USUARIO", id);
      sessionStorage.setItem("NOME_USUARIO", nome);
      sessionStorage.setItem("EMAIL_USUARIO", email);
    }

    return { id, nome, email };
  }

  function sair() {
    sessionStorage.clear();
    window.location = "inde";
  }
</script>
