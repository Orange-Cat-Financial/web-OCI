<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orange Cat</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="icon" type="image/png" href="img/log-sem-fundo.png" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/funci.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Krona+One&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body
    onload="
      obterDadosGrafico();
      obterDadosRosca();
      oValorTotal();
      retornar3Linhas();
    "
  >
    <header id="cabecalho">
      <div class="ft_e_nm">
        <a href="../index.html">
          <img
            src="../assets/icones/log-sem-fundo.png"
            style="height: 90px; width: 80px"
          />
        </a>
        <span> <span style="color: #f65d09">Orange</span> Cat</span>
      </div>
      <div class="criar_conta_he">
        <div class="usuarioHeader">
          <img
            id="img_usuario"
            src="../assets/imgUsuarioAdd/foto-perfil/sem_usuario.png"
            style="width: 38px; height: 38px"
          /><a class="hd_nm_usuario" href="../cadastro.html"
            ><span id="b_usuario">usuário</span></a
          >
        </div>
      </div>
    </header>
    <div id="pt_baixo_funci">
      <div class="pt_esquerda_menu">
        <div class="ls_esq">
          <a href="addTr.html">Transação</a>
          <a href="aventuras.html">Aventuras</a
          ><a href="addAventura.html">addAventura</a>
          <a href="historicoTr.html">Historico</a>
          <a href="dashboard.html">Dashboard</a>
        </div>
      </div>
      <div class="pt_direita_conteudo">
        <div class="container">
          <div class="item">
            <span>Valor na conta:</span>
            <span class="valor_kpi_cima" id="saldoTotal">R$ 850,00</span>
          </div>
          <div class="item">
            <span>Ganhos:</span>
            <div class="seta_com_span">
              <img src="../assets/png/cima_branco.png" class="setas st_cm" />
              <span class="valor_kpi_cima" id="totalGanhos">R$ 0,00</span>
            </div>
          </div>
          <div class="item">
            <span>Despesas:</span>
            <div class="seta_com_span">
              <img src="../assets/png/baixo_branco.png" class="setas st_bx" />
              <span class="valor_kpi_cima" id="totalDespesas"> R$ 0,00</span>
            </div>
          </div>
        </div>
        <div class="graficos">
          <div class="graficoEsq" id="graficoEsq">
            <canvas id="graficoLinha"></canvas>
          </div>
          <div class="graficoDir">
            <canvas id="graficoRosca"></canvas>
            <div id="sp_g_rosca">
              <div id="pt_cima_btsl">
                <h4>Quanto gastou com?</h4>
                <div id="bt_sl">
                  <select id="sda" onchange="mostrarGastoCategoria()">
                    <option value="Comida">Comida</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Aluguel">Aluguel</option>
                    <option value="Roupa">Roupa</option>
                    <option value="Lazer">Lazer</option>
                    <option value="Outro">Outro</option>
                  </select>
                </div>
              </div>
              <div id="gastou_com">
                <span>Gastou:</span>
                <span id="valorCategoria">R$ 0,00</span>
                <span id="nomeCategoria">Com comida</span>
              </div>
            </div>
          </div>
        </div>
        <div class="kpi_pt_baixo">
          <div class="kpi_baixo_esquerda">
            <span class="tema_kpi_baixo">Ultimas 3 transações:</span>
            <div class="transacao_u5" id="ul1"></div>
            <div class="transacao_u5" id="ul2"></div>
            <div class="transacao_u5" id="ul3"></div>
          </div>
          <div class="kpi_baixo_direita">
            <div id="deixar_coluna">
              <span class="tema_kpi_baixo">Proxima meta:</span>
              <div class="pt_esquerda_meta">
                <span
                  >Falta: <br /><span class="falta_bx_kpi"
                    >R$ 1.650,00</span
                  ></span
                ><span
                  >Para a meta: <br />
                  <span class="falta_bx_kpi">R$ 2.500,00</span></span
                >
              </div>
            </div>
            <canvas id="graficoBarra"></canvas>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
  img_usuario.src = `../assets/imgUsuarioAdd/foto-perfil/${sessionStorage.FOTO_USUARIO}`;

  const labelsLinha = ["04/28", "04/29", "05/01", "05/03", "05/06", "05/08"];

  let proximaAtualizacao;

  const ctx = document.getElementById("graficoBarra");

  new Chart(ctx, {
    type: "bar",

    data: {
      labels: [""],

      datasets: [
        {
          label: "Já tem",
          data: [34],
          backgroundColor: "#f65d09",
        },
        {
          label: "Falta",
          data: [66],
          backgroundColor: "#6c6969",
        },
      ],
    },

    options: {
      indexAxis: "y",

      responsive: true,

      scales: {
        x: {
          stacked: true,
          max: 100,
          display: false,
        },

        y: {
          stacked: true,
          display: false,
        },
      },
    },
  });

  function obterDadosGrafico(idUsuario) {
    if (proximaAtualizacao != undefined) {
      clearTimeout(proximaAtualizacao);
    }

    fetch(`/medidas/ultimas/${sessionStorage.ID_USUARIO}`, {
      cache: "no-store",
    })
      .then(function (response) {
        if (response.ok) {
          response.json().then(function (resposta) {
            console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
            resposta.reverse();

            plotarGrafico(resposta);
          });
        } else {
          console.error("Nenhum dado encontrado ou erro na API");
        }
      })
      .catch(function (error) {
        console.error(
          `Erro na obtenção dos dados p/ gráfico: ${error.message}`,
        );
      });
  }

  function obterDadosRosca(idUsuario) {
    if (proximaAtualizacao != undefined) {
      clearTimeout(proximaAtualizacao);
    }

    fetch(`/medidas/ultimasRosca/${sessionStorage.ID_USUARIO}`, {
      cache: "no-store",
    })
      .then(function (response) {
        if (response.ok) {
          response.json().then(function (resposta) {
            console.log(`Dados recebidos: ${JSON.stringify(resposta)}`);
            resposta.reverse();

            plotarGraficoRosca(resposta);
          });
        } else {
          console.error("Nenhum dado encontrado ou erro na API");
        }
      })
      .catch(function (error) {
        console.error(
          `Erro na obtenção dos dados p/ gráfico: ${error.message}`,
        );
      });
  }

  // Esta função *plotarGrafico* usa os dados capturados na função anterior para criar o gráfico
  // Configura o gráfico (cores, tipo, etc), materializa-o na página e,
  // A função *plotarGrafico* também invoca a função *atualizarGrafico*
  function plotarGrafico(resposta) {
    console.log("iniciando plotagem do gráfico...");

    // Criando estrutura para plotar gráfico - labels
    let labels = [];
    let valores = [];

    console.log("----------------------------------------------");
    console.log(
      'Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":',
    );
    console.log(resposta);

    // Inserindo valores recebidos em estrutura para plotar o gráfico
    for (let i = 0; i < resposta.length; i++) {
      var registro = resposta[i];
      labels.push(registro.dataTransacao);
      valores.push(registro.SaldoTotal);
    }

    console.log("----------------------------------------------");
    console.log("O gráfico será plotado com os respectivos valores:");
    console.log("Labels:");
    console.log(labels);
    console.log("Dados:");
    console.log("----------------------------------------------");

    new Chart(document.getElementById("graficoLinha"), {
      type: "line",

      data: {
        labels: labels,

        datasets: [
          {
            label: "Dinheiro na conta",

            data: valores,

            borderColor: "#f65d09",
            backgroundColor: "#f65d09",

            borderWidth: 3,
            tension: 0.3,
          },
        ],
      },

      options: {
        responsive: true,
      },
    });
  }

  function plotarGraficoRosca(resposta) {
    console.log("iniciando plotagem do gráfico...");

    // Criando estrutura para plotar gráfico - labels
    let labels = [];
    let valores = [];

    console.log("----------------------------------------------");
    console.log(
      'Estes dados foram recebidos pela funcao "obterDadosGrafico" e passados para "plotarGrafico":',
    );
    console.log(resposta);

    // Inserindo valores recebidos em estrutura para plotar o gráfico
    for (let i = 0; i < resposta.length; i++) {
      var registro = resposta[i];
      labels.push(registro.categoria);
      valores.push(registro.total);
    }

    const cores = [
      "#FF6B00",
      "#00B4D8",
      "#7B2CBF",
      "#FFB347",
      "#D7263D",
      "#6C757D",
      "#F5F5F5",
    ];

    console.log("----------------------------------------------");
    console.log("O gráfico será plotado com os respectivos valores:");
    console.log("Labels:");
    console.log(labels);
    console.log("Dados:");
    console.log("----------------------------------------------");

    new Chart(document.getElementById("graficoRosca"), {
      type: "doughnut",

      data: {
        labels: labels,

        datasets: [
          {
            label: "Gastou",

            data: valores,

            borderColor: cores,
            backgroundColor: cores,
          },
        ],
      },

      options: {
        responsive: true,
      },
    });
  }

  function oValorTotal() {
    let idUsuario = sessionStorage.ID_USUARIO;

    fetch(`/transacao/dinheiroTt/${idUsuario}`)
      .then(function (resposta) {
        if (resposta.ok) {
          resposta.json().then(function (resposta) {
            console.log("Dados recebidos: ", JSON.stringify(resposta));

            saldoTotal.innerHTML = Number(
              resposta[0].valorTotal,
            ).toLocaleString("pt-BR", {
              style: "currency",
              currency: "BRL",
            });

            totalGanhos.innerHTML = Number(resposta[0].receita).toLocaleString(
              "pt-BR",
              {
                style: "currency",
                currency: "BRL",
              },
            );
            totalDespesas.innerHTML = Number(
              resposta[0].despesa,
            ).toLocaleString("pt-BR", {
              style: "currency",
              currency: "BRL",
            });
          });
        }
      })
      .catch(function (resposta) {
        console.error(resposta);
      });
  }

  function mostrarGastoCategoria() {
    let categoria = sda.value;

    fetch(`/medidas/gastoCategoria/${sessionStorage.ID_USUARIO}/${categoria}`)
      .then(function (resposta) {
        if (resposta.ok) {
          resposta.json().then(function (dados) {
            let valor = 0;

            if (dados.length > 0) {
              valor = Number(dados[0].total);
            }

            valorCategoria.innerHTML = valor.toLocaleString("pt-BR", {
              style: "currency",
              currency: "BRL",
            });

            nomeCategoria.innerHTML = `Com ${categoria.toLowerCase()}`;
          });
        }
      })
      .catch(function (erro) {
        console.log(erro);
      });
  }

  function retornar3Linhas() {
    console.log("ID USUARIO FRONT:", sessionStorage.ID_USUARIO);
    let idUsuario = sessionStorage.ID_USUARIO;

    fetch(`/medidas/retornar3Linhas/${idUsuario}`)
      .then(function (resposta) {
        if (resposta.ok) {
          resposta.json().then(function (resposta) {
            console.log("Dados recebidos: ", JSON.stringify(resposta));

            ul1.innerHTML = `<span>${resposta.tipo}</span><span>${Number(
              resposta[0].valor,
            ).toLocaleString("pt-BR", {
              style: "currency",
              currency: "BRL",
            })}</span><span>${resposta[0].categoria}</span><span>${resposta[0].dataTransacao}</span>`;

            ul2.innerHTML = `<span>${resposta[1].tipo}</span><span>${Number(
              resposta[1].valor,
            ).toLocaleString("pt-BR", {
              style: "currency",
              currency: "BRL",
            })}</span><span>${resposta[1].categoria}</span><span>${resposta[1].dataTransacao}</span>`;

            ul3.innerHTML = `<span>${resposta[2].tipo}</span><span>${Number(
              resposta[2].valor,
            ).toLocaleString("pt-BR", {
              style: "currency",
              currency: "BRL",
            })}</span><span>${resposta[2].categoria}</span><span>${resposta[2].dataTransacao}</span>`;
          });
        }
      })
      .catch(function (resposta) {
        console.error(resposta);
      });
  }
</script>
