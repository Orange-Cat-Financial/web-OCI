<script>
  b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
  img_usuario.src = `../assets/imgUsuarioAdd/foto-perfil/${sessionStorage.FOTO_USUARIO}`;

  function ftNmUsuario() {}

  function focarData() {
    document.getElementById("ipt_data").focus();
  }

  function focarCtg() {
    document.getElementById("slc_categoria").focus();
  }

  function fcc() {
    if (tip_receita.checked) {
      qtd_dinheiro_exibida.style.borderBottom = "5px solid green";
    } else if (tip_despesa.checked) {
      qtd_dinheiro_exibida.style.borderBottom = "5px solid red";
    }

    let select = document.getElementById("slc_categoria");

    if (tip_receita.checked) {
      select.innerHTML = `
      <option value="Salário">Salário</option>
      <option value="Presente">Presente</option>
      <option value="Outro">Outro</option>

      `;
    } else if (tip_despesa.checked) {
      select.innerHTML = `
      <option value="Comida">Comida</option>
      <option value="Transporte">Transporte</option>
      <option value="Aluguel">Aluguel</option>
      <option value="Roupa">Roupa</option>
      <option value="Lazer">Lazer</option>
      <option value="Outro">Outro</option>
    `;
    }

    let categoria = slc_categoria.value;
    sp_categoria.innerHTML = categoria;
  }

  function datarMos() {
    let data = ipt_data.value;

    let partes = data.split("-");
    let formatada = `${partes[2]}/${partes[1]}/${partes[0]}`;

    sp_data.innerHTML = formatada;
  }

  function categoriaMos() {
    let categoria = slc_categoria.value;
    sp_categoria.innerHTML = categoria;
  }

  function recOuDes() {
    let borda;
    caixa.classList.toggle("ativa");
  }

  function focarIpt() {
    document.getElementById("ipt_valor").focus();
  }

  function mudarDinheiro() {
    let valor = Number(ipt_valor.value);
    qtd_dinheiro_exibida.innerHTML = `${valor.toLocaleString("pt-BR", {
      style: "currency",
      currency: "BRL",
    })}`;
  }
</script>
