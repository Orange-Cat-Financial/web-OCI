<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orange Cat</title>
    <link
      rel="icon"
      type="image/png"
      href="../assets/icones/log-sem-fundo.png"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/funci.css" />
    <link rel="stylesheet" href="../css/addTr.css" />
    <link rel="stylesheet" href="../css/addAventura.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Krona+One&family=Manrope:wght@200..800&family=Outfit:wght@100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header id="cabecalho">
      <div class="ft_e_nm">
        <a href="addAventura.html">
          <img
            src="../assets/icones/log-sem-fundo.png"
            style="height: 90px; width: 80px"
          />
        </a>
        <span> <span style="color: #f65d09">Orange</span> Cat</span>
      </div>
      <div class="criar_conta_he">
        <div class="usuarioHeader">
          <img
            id="img_usuario"
            src="../assets/imgUsuarioAdd/foto-perfil/sem_usuario.png"
            style="width: 38px; height: 38px"
          /><a class="hd_nm_usuario" href="usuario.html"
            ><span id="b_usuario">usuário</span></a
          >
        </div>
      </div>
    </header>
    <div id="pt_baixo_funci">
      <div class="pt_esquerda_menu">
        <div class="ls_esq">
          <a id="a_transacao" href="addTr.html">Transação</a>
          <a id="a_historico" href="historicoTr.html">Historico</a>
          <a id="a_dashboard" href="dashboard.html">Dashboard</a><br />
          <a id="a_escolhido" href="addAventura.html">Nova aventura</a>
          <a id="a_s_aventura" href="aventuras.html">Suas aventuras</a><br />
          <a id="a_usuario" href="usuario.html">Perfil</a>
        </div>
      </div>
      <div class="pt_direita_conteudo">
        <h1 id="titulo_da_pagina">Novas aventuras?</h1>
        <div class="caixa_adicionar">
          <div class="despesa_receita">o o o o o o o</div>

          <div class="ipts_baixo">
            <div class="linhas l1">
              <div class="nm_ipts div_ipt_valor">
                <div class="tx_pg">
                  <span class="indicador">Titulo da aventura:</span>
                  <input
                    type="text"
                    id="ipt_titulo"
                    placeholder="EX: Trilha pico Pão de açucar"
                  />
                </div>
                <div class="tx_pg">
                  <span class="indicador">Data</span>
                  <input type="date" id="ipt_data" />
                </div>
                <div class="tx_pg">
                  <span class="indicador">Localização</span>
                  <input
                    type="text"
                    id="ipt_local"
                    placeholder="EX: Trindade"
                  />
                </div>
                <div class="tx_pg">
                  <span class="indicador">Imagem:</span>
                  <label for="ipt_imagem_avent" class="label_add_imagem"
                    >Adicionar imagem</label
                  >
                  <input type="file" id="ipt_imagem_avent" />
                </div>
              </div>
            </div>
          </div>
          <button onclick="adicionarAventura()">Adicionar</button>
        </div>
      </div>
      <div class="cx_canto_descricao">
        Descricão: <textarea id="ipt_desc"></textarea>
      </div>
    </div>
  </body>
</html>
<script>
  b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
  img_usuario.src = `../assets/imgUsuarioAdd/foto-perfil/${sessionStorage.FOTO_USUARIO}`;

  function adicionarAventura() {
    const formData = new FormData();

    let titulo = ipt_titulo.value;
    let dt = ipt_data.value;
    let locali = ipt_local.value;
    let desc = ipt_desc.value;

    formData.append("foto", ipt_imagem_avent.files[0]);
    formData.append("titulo", titulo);

    formData.append("data", dt);

    formData.append("localizacao", locali);

    formData.append("descricao", desc);

    formData.append("fkUsuario", sessionStorage.ID_USUARIO);

    fetch("/foto/cadastroAventura", {
      method: "POST",
      body: formData,
    })
      .then((res) => {
        window.location = "addAventura.html";
      })
      .catch((err) => {
        console.log(err);
      });
  }

  function obterSessao() {
    let id = sessionStorage.getItem("ID_USUARIO");
    let nome = sessionStorage.getItem("NOME_USUARIO");
    let email = sessionStorage.getItem("EMAIL_USUARIO");

    if (id && !sessionStorage.getItem("ID_USUARIO")) {
      sessionStorage.setItem("ID_USUARIO", id);
      sessionStorage.setItem("NOME_USUARIO", nome);
      sessionStorage.setItem("EMAIL_USUARIO", email);
    }

    return { id, nome, email };
  }

  function validarSessao() {
    let sessao = obterSessao();
    if (!sessao.id) {
      window.location = "login.html";
    }
    return sessao;
  }

  function sair() {
    sessionStorage.clear();
    window.location = "home.html";
  }
</script>
