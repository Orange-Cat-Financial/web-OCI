<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orange Cat</title>
    <link
      rel="icon"
      type="image/png"
      href="../assets/icones/log-sem-fundo.png"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/funci.css" />
    <link rel="stylesheet" href="../css/addTr.css" />
    <link rel="stylesheet" href="../css/historicoTr.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Krona+One&family=Manrope:wght@200..800&family=Outfit:wght@100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body
    onload="
      atualizarFeed();
      oValorTotal();
    "
  >
    <header id="cabecalho">
      <div class="ft_e_nm">
          <img
            src="../assets/icones/log-sem-fundo.png"
            style="height: 90px; width: 80px"
          />
        </a>
        <span> <span style="color: #f65d09">Orange</span> Cat</span>
      </div>
      <div class="criar_conta_he">
        <div class="usuarioHeader">
          <img
            id="img_usuario"
            src="../assets/imgUsuarioAdd/foto-perfil/sem_usuario.png"
            style="width: 38px; height: 38px"
          /><a class="hd_nm_usuario" href="usuario.html"
            ><span id="b_usuario">usuário</span></a
          >
        </div>
      </div>
    </header>
    <div id="pt_baixo_funci">
      <div class="pt_esquerda_menu">
        <div class="ls_esq">
          <a id="a_transacao" href="addTr.html">Transação</a>
          <a id="a_escolhido" href="historicoTr.html">Historico</a>
          <a id="a_dashboard" href="dashboard.html">Dashboard</a><br />
          <a id="a_n_aventura" href="addAventura.html">Nova aventura</a>
          <a id="a_s_aventura" href="aventuras.html">Suas aventuras</a><br />
          <a id="a_usuario" href="usuario.html">Perfil</a>
        </div>
      </div>
      <div class="pt_direita_conteudo">
        <h1 id="titulo_da_pagina">Historico de transferencias</h1>
        <p class="totalRs" id="totalRs">Total na conta: R$0,00</p>
        <span class="totalRs">Qual o tipo de busca?</span>
        <select id="sl_tipo" onchange="atualizarFeed()">
          <option value="e">Todos</option>
          <option value="receita">Receita</option>
          <option value="despesa">Despesa</option>
        </select>
        <div class="container" id="container"></div>
      </div>
    </div>
  </body>
</html>

<script>
  b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
  img_usuario.src = `../assets/imgUsuarioAdd/foto-perfil/${sessionStorage.FOTO_USUARIO}`;

  function deletar(idTransferencia) {
    console.log("Criar função de apagar post escolhido - ID" + idTransferencia);
    fetch(`/avisos/deletar/${idTransferencia}`, {
      method: "DELETE",
      headers: {
        "Content-Type": "application/json",
      },
    })
      .then(function (resposta) {
        if (resposta.ok) {
          window.alert(
            "Post deletado com sucesso pelo usuario de email: " +
              sessionStorage.getItem("EMAIL_USUARIO") +
              "!",
          );
          window.location = "/dashboard/mural.html";
        } else if (resposta.status == 404) {
          window.alert("Deu 404!");
        } else {
          throw (
            "Houve um erro ao tentar realizar a postagem! Código da resposta: " +
            resposta.status
          );
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }

  function atualizarFeed() {
    let idUsuario = sessionStorage.ID_USUARIO;
    let filtro = sl_tipo.value;
    fetch(`/transacao/listar/${idUsuario}/${filtro}`)
      .then(function (resposta) {
        if (resposta.ok) {
          if (resposta.status == 204) {
            let feed = document.getElementById("container");
            let mensagem = document.createElement("span");
            mensagem.innerHTML = "Nenhum resultado encontrado.";
            feed.appendChild(mensagem);
            throw "Nenhum resultado encontrado!!";
          }

          resposta.json().then(function (resposta) {
            console.log("Dados recebidos: ", JSON.stringify(resposta));

            let feed = document.getElementById("container");
            feed.innerHTML = "";
            for (let i = 0; i < resposta.length; i++) {
              let publicacao = resposta[i];
              let tipoR = "Retirou";

              // criando e manipulando elementos do HTML via JavaScript
              let divPublicacao = document.createElement("div");
              divPublicacao.className = "item";

              if (publicacao.tipo == "receita") {
                divPublicacao.style.borderBottom = "4px solid green";
                tipoR = "Recebeu";
              } else {
                divPublicacao.style.borderBottom = "4px solid red";
              }
              let spanCategoria = document.createElement("span");
              let spanValor = document.createElement("span");
              let spanData = document.createElement("span");

              let modalSpanCategoria = document.createElement("span");
              let modalSpanValor = document.createElement("span");
              let modalSpanData = document.createElement("span");
              let modalSpanDescricao = document.createElement("span");

              let modalFundoTopEscuro = document.createElement("div");
              modalFundoTopEscuro.className = "modal-bg";

              let modal = document.createElement("div");
              modal.className = "modal";

              let botoesRowModal = document.createElement("div");
              botoesRowModal.className = "botoesRowModal";

              let modalTitulo = document.createElement("b");
              let modalDescricao = document.createElement("span");
              let btFechar = document.createElement("button");
              let btDeletar = document.createElement("button");

              modalTitulo.innerHTML = publicacao.titulo;

              spanValor.innerHTML = `<span>${tipoR}:</span>  <span>R$ ${publicacao.valor}</span>`;
              spanCategoria.innerHTML = `<span>Categoria:</span>  <span>${publicacao.categoria}</span>`;
              spanData.innerHTML = `<span>Data:</span>  <span>${publicacao.dataTransacao.split("T")[0]}</span>`;

              modalSpanValor.innerHTML = `<span>${tipoR}:</span>  <span>R$ ${publicacao.valor}</span>`;
              modalSpanCategoria.innerHTML = `<span>Categoria:</span>  <span>${publicacao.categoria}</span>`;
              modalSpanData.innerHTML = `<span>Data:</span>  <span>${publicacao.dataTransacao.split("T")[0]}</span>`;
              modalSpanDescricao.innerHTML = `${publicacao.descricao}`;

              btFechar.innerHTML = "x";
              btDeletar.innerHTML = "del";

              divPublicacao.onclick = function () {
                modalFundoTopEscuro.style.display = "flex";
              };

              btFechar.onclick = function () {
                modalFundoTopEscuro.style.display = "none";
              };

              btDeletar.onclick = function () {
                deletar();
              };

              divPublicacao.appendChild(spanValor);
              divPublicacao.appendChild(spanCategoria);
              divPublicacao.appendChild(spanData);

              modal.appendChild(modalSpanValor);
              modal.appendChild(modalSpanCategoria);
              modal.appendChild(modalSpanData);
              modal.appendChild(modalSpanDescricao);
              botoesRowModal.appendChild(btFechar);
              botoesRowModal.appendChild(btDeletar);
              modal.appendChild(botoesRowModal);
              modalFundoTopEscuro.appendChild(modal);
              feed.appendChild(modalFundoTopEscuro);
              feed.appendChild(divPublicacao);
            }
          });
        } else {
          throw "Houve um erro na API!";
        }
      })
      .catch(function (resposta) {
        console.error(resposta);
      });
  }
  function oValorTotal() {
    let idUsuario = sessionStorage.ID_USUARIO;

    fetch(`/transacao/dinheiroTt/${idUsuario}`)
      .then(function (resposta) {
        if (resposta.ok) {
          resposta.json().then(function (resposta) {
            console.log("Dados recebidos: ", JSON.stringify(resposta));

            let total = document.getElementById("totalRs");
            let dinheiro = Number(resposta[0].valorTotal);

            console.log(resposta);

            total.innerHTML = `Total na conta:  ${dinheiro.toLocaleString(
              "pt-BR",
              {
                style: "currency",
                currency: "BRL",
              },
            )}`;
          });
        } else {
          throw "Houve um erro na API!";
        }
      })
      .catch(function (resposta) {
        console.error(resposta);
      });
  }
</script>
