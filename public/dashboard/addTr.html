<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orange Cat</title>
    <link rel="icon" type="image/png" href="img/log-sem-fundo.png" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/funci.css" />
    <link rel="stylesheet" href="../css/addTr.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Krona+One&family=Manrope:wght@200..800&family=Outfit:wght@100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header id="cabecalho">
      <div class="ft_e_nm">
        <a href="../index.html">
          <img
            src="../assets/icones/log-sem-fundo.png"
            style="height: 90px; width: 80px"
          />
        </a>
        <span> <span style="color: #f65d09">Orange</span> Cat</span>
      </div>
      <div class="criar_conta_he">
        <div class="usuarioHeader">
          <img
            src="../assets/imgUsuarioAdd/foto-perfil/sem_usuario.png"
            style="width: 38px; height: 38px"
          /><a class="hd_nm_usuario" href="../cadastro.html">Usuario</a>
        </div>
      </div>
    </header>
    <div id="pt_baixo_funci">
      <div class="pt_esquerda_menu">
        <div class="ls_esq">
          <a href="addTr.html">Transação</a>
          <a href="aventuras.html">Aventuras</a><a href="">Transação</a>
        </div>
      </div>
      <div class="pt_direita_conteudo">
        <h1 id="titulo_da_pagina">Adicionar Nova Transação</h1>
        <div class="caixa_adicionar">
          <div class="despesa_receita">
            <input type="radio" name="tipo" id="tip_receita" onclick="fcc()" />
            <label for="tip_receita" class="seta_cm_txt">
              <img src="../assets/png/cima_branco.png" class="setas st_cm" />
              <span>Receita</span>
            </label>
            <input type="radio" name="tipo" id="tip_despesa" onclick="fcc()" />
            <label for="tip_despesa" class="seta_cm_txt">
              <img src="../assets/png/baixo_branco.png" class="setas st_bx" />
              <span>Despesa</span>
            </label>
          </div>
          <span id="qtd_dinheiro_exibida" onclick="focarIpt()">R$0.00</span>
          <div id="dt_e_ctg">
            <div
              class="div_info_bx_valor info_baixo_valor"
              onclick="focarData()"
            >
              <img src="../assets/icones/001-calendar.png" /><span id="sp_data"
                >--/--/----</span
              >
            </div>
            <div
              class="div_info_bx_valor info_baixo_valor"
              onclick="focarCtg()"
            >
              <img src="../assets/icones/002-category.png" /><span
                id="sp_categoria"
                >Categoria</span
              >
            </div>
          </div>
          <div class="ipts_baixo">
            <div class="linhas l1">
              <div class="nm_ipts div_ipt_valor">
                <span class="indicador">Valor:</span>
                <input
                  type="number"
                  id="ipt_valor"
                  oninput="mudarDinheiro()"
                  placeholder="EX: 2400"
                />
              </div>
              <div class="nm_ipts div_slc_tipo">
                <span class="indicador">Categoria:</span>
                <select id="slc_categoria" onchange="categoriaMos()">
                  <option value="ctg">Selecione o tipo de transferencia</option>
                </select>
              </div>
            </div>
            <div class="linhas l1">
              <div class="nm_ipts div_ipt_valor">
                <span class="indicador">Data:</span>
                <input type="date" id="ipt_data" onchange="datarMos()" />
              </div>
              <div class="nm_ipts div_slc_tipo">
                <span class="indicador">Descrição:</span>
                <input type="text" id="ipt" placeholder="(Opcional)" />
              </div>
              <a href="uplArquivo.html">imagem</a>
            </div>
          </div>
          <button onclick="adicionarTransf()">Adicionar</button>
        </div>
      </div>
    </div>
  </body>
</html>
<script>
  function ftNmUsuario() {}

  function focarData() {
    document.getElementById("ipt_data").focus();
  }

  function focarCtg() {
    document.getElementById("slc_categoria").focus();
  }

  function fcc() {
    if (tip_receita.checked) {
      qtd_dinheiro_exibida.style.borderBottom = "5px solid green";
    } else if (tip_despesa.checked) {
      qtd_dinheiro_exibida.style.borderBottom = "5px solid red";
    }

    let select = document.getElementById("slc_categoria");

    if (tip_receita.checked) {
      select.innerHTML = `
      <option value="Salário">Salário</option>
      <option value="Presente">Presente</option>
      <option value="Outro">Outro</option>

      `;
    } else if (tip_despesa.checked) {
      select.innerHTML = `
      <option value="Comida">Comida</option>
      <option value="Transporte">Transporte</option>
      <option value="Aluguel">Aluguel</option>
      <option value="Roupa">Roupa</option>
      <option value="Lazer">Lazer</option>
      <option value="Outro">Outro</option>
    `;
    }

    let categoria = slc_categoria.value;
    sp_categoria.innerHTML = categoria;
  }

  function datarMos() {
    let data = ipt_data.value;

    let partes = data.split("-");
    let formatada = `${partes[2]}/${partes[1]}/${partes[0]}`;

    sp_data.innerHTML = formatada;
  }

  function categoriaMos() {
    let categoria = slc_categoria.value;
    sp_categoria.innerHTML = categoria;
  }

  function recOuDes() {
    let borda;
    caixa.classList.toggle("ativa");
  }

  function focarIpt() {
    document.getElementById("ipt_valor").focus();
  }

  function mudarDinheiro() {
    let valor = Number(ipt_valor.value);
    qtd_dinheiro_exibida.innerHTML = `${valor.toLocaleString("pt-BR", {
      style: "currency",
      currency: "BRL",
    })}`;
  }
</script>
