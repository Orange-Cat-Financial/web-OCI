<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload</title>
  </head>

  <body>
    <h1>TESTANDO UPLOAD DE ARQUIVOS PARA PAGINA</h1>
    <br />
    <div>
      <input name="foto" id="foto" type="file" />
      <button onclick="enviar()">Enviar</button>
    </div>
    <a href="dashboard/addTr.html">Voltar</a>

    <div id="container"></div>
  </body>
</html>

<script>
  function enviar() {
    const formData = new FormData();
    formData.append("foto", foto.files[0]);

    fetch("/foto/cadastro", {
      method: "POST",
      body: formData,
    })
      .then((res) => {
        window.location = "dashboard/addTr.html";
      })
      .catch((err) => {
        console.log(err);
      });
  }
</script>
